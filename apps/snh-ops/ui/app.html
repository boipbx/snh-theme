<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="shopify-api-key" content="__API_KEY__">
<title>Ops dashboard</title>
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap">
<style>
:root{--brand:#F65922;--accent:#BF4512;--ink:#0C0C0D;--sub:#5F5F61;--mute:#8B8B8D;--line:rgba(12,12,13,.1);--bg:#F5F2EC;--card:#FFFFFF;--soft:#FAF8F4;--ok:#0A7D4F;--warn:#9A6700;--bad:#C4320A;
--bronze:#B8743F;--silver:#A9B0B8;--gold:#D9A521;--s1:#D9531E;--s2:#2F6FB7;--s3:#2E9E83;--s4:#8A5CC2;--s5:#B8860B;--s6:#9A9A9C;--guest:#B9B4AA;--grid:rgba(12,12,13,.07);
--r:16px;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Instrument Serif",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--ink:#F3F1EC;--sub:#B9B6AE;--mute:#8E8B84;--line:rgba(255,255,255,.14);--bg:#111112;--card:#1B1B1D;--soft:#232325;--ok:#3CCB8C;--warn:#E3B341;--bad:#FF8A65;--accent:#F0703C;
--s1:#E0602B;--s2:#3D7EC6;--s3:#2E9E83;--s4:#9368CC;--s5:#B8860B;--s6:#77777A;--guest:#5E5B55;--grid:rgba(255,255,255,.08);--silver:#C9CED4;--bronze:#D49461;--gold:#F0C04A}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 48px}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.logo{display:flex;align-items:baseline;gap:8px;font-size:26px;line-height:1;white-space:nowrap}
.logo i{display:block;height:22px;aspect-ratio:600/175;background:var(--brand);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo b{font-weight:700;letter-spacing:-.02em}.logo em{font-family:var(--serif);font-style:italic;font-weight:400;font-size:28px}
.logo span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);padding:4px 8px;border:1px solid var(--line);border-radius:999px;align-self:center}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--sub);font:600 13px/1 var(--sans);padding:9px 14px;min-height:36px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px/1 var(--sans);padding:0 14px;min-height:40px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}.btn--pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn--sm{min-height:32px;padding:0 12px;font-size:12px}.btn[disabled]{opacity:.5;cursor:default}
.btn--bad{color:var(--bad)}
input[type=date],input[type=search],select{font:500 13px/1 var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:38px;padding:0 10px}
.custom{display:none;gap:6px;align-items:center}.custom[data-on]{display:inline-flex}
.status{font-size:12px;color:var(--sub);margin:-6px 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.dot[data-s=run]{background:var(--brand);animation:pulse 1s infinite}.dot[data-s=bad]{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:12px 16px;min-height:44px;font:600 14px/1 var(--sans);color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brand)}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px}
.note[data-k=bad]{border-left-color:var(--bad)}
.grid{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:2fr 1fr}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21{grid-template-columns:1fr}}
@media (max-width:640px){.g2{grid-template-columns:1fr}.wrap{padding:16px 16px 40px}.g4{gap:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card h2{font:600 15px/1.3 var(--sans);margin:0}.card .hd{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.sub{color:var(--sub);font-size:12px;margin:2px 0 0}.est{display:inline-block;font:600 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:3px 6px;vertical-align:middle}
.kpi{position:relative;overflow:hidden}.kpi .l{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.02em}
.kpi .v{font:700 28px/1.15 var(--sans);letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--sub);min-height:18px}.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}
.kpi svg{position:absolute;right:14px;top:12px;width:64px;height:22px;opacity:.9}
.kpi--hero{background:linear-gradient(150deg,#1A1A1C,#0C0C0D);color:#F3F1EC;border-color:transparent}.kpi--hero .l,.kpi--hero .d{color:#C9C5BC}
@media (max-width:640px){.seg{max-width:100%;overflow-x:auto}.seg button{padding:9px 10px;white-space:nowrap}.kpi .v{font-size:22px}.kpi svg{display:none}.card{padding:16px}}
.chart{position:relative;height:280px}.chart--s{height:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{display:grid;place-items:center;text-align:center;color:var(--sub);font-size:13px;padding:28px 12px;border:1px dashed var(--line);border-radius:12px}
.tw{overflow-x:auto;margin:0 -4px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 11px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--sub);position:sticky;top:0;background:var(--card)}
th[data-k]{cursor:pointer;user-select:none}th[aria-sort=ascending]::after{content:" ↑"}th[aria-sort=descending]::after{content:" ↓"}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.w{white-space:normal;min-width:180px}tbody tr:hover{background:var(--soft)}tr:last-child td{border-bottom:0}
.pill{display:inline-block;font:600 11px/1 var(--sans);padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.pill--new{background:var(--brand);border-color:var(--brand);color:#fff}.pill--ok{color:var(--ok)}.pill--bad{color:var(--bad)}.pill--warn{color:var(--warn)}
.tier{display:inline-flex;align-items:center;gap:6px}.tier::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--tc,var(--mute))}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.donut{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center}@media (max-width:640px){.donut{grid-template-columns:1fr}.donut .chart{max-width:200px;margin:0 auto}}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:13px}.kv b{font-variant-numeric:tabular-nums}
.sk{border-radius:var(--r);background:linear-gradient(90deg,var(--card) 25%,var(--soft) 37%,var(--card) 63%);background-size:400% 100%;animation:sh 1.2s ease infinite;border:1px solid var(--line)}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.sk,.dot{animation:none}}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--sub)}
[hidden]{display:none!important}
</style></head>
<body><div class="wrap">
<div class="top">
  <div class="logo" id="logo"><b>Ops</b></div>
  <div class="ctl">
    <div class="seg" id="ranges" role="group" aria-label="Date range"><button data-d="7">7 days</button><button data-d="30" aria-pressed="true">30 days</button><button data-d="90">90 days</button><button data-d="365">12 months</button><button data-d="custom">Custom</button></div>
    <span class="custom" id="custom"><input type="date" id="from" aria-label="From"><span>to</span><input type="date" id="to" aria-label="To"></span>
    <button class="btn btn--pri" id="refresh">Refresh now</button>
  </div>
</div>
<div class="status" id="status"><span class="dot"></span><span>Loading…</span></div>
<div class="tabs" role="tablist" id="tabs"><button role="tab" data-t="overview" aria-selected="true">Overview</button><button role="tab" data-t="loyalty">Loyalty</button><button role="tab" data-t="bundles">Bundles</button><button role="tab" data-t="operations">Operations</button></div>
<div id="notes"></div>
<main id="view"><div class="grid g4"><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div></div><div class="grid g21"><div class="sk" style="height:360px"></div><div class="sk" style="height:360px"></div></div></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script>

    var cols = [{ k: 'name', label: 'Flow' }, { k: 'status', label: 'Status', html: function (f) { return '<span class="pill' + (f.status === 'live' ? ' pill--ok' : '') + '">' + esc(f.status) + '</span>'; } }, { k: 'sent', label: 'Received', n: 1, fmt: N }, { k: 'opened', label: 'Opened', n: 1, fmt: N }, { k: 'clicked', label: 'Clicked', n: 1, fmt: N }]; if (k.revenue) cols.push({ k: 'revenue', label: 'Revenue', n: 1, fmt: money });

function render() {

async function load() {
