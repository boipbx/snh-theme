# SNH Staff tile for Shopify POS (smart grid). Shows the cart customer's Elite points and how to open SNH Staff.
# Deploy with the Shopify CLI from apps/snh-ops (see docs/golive/STAFF-CONSOLE-SETUP.md, "POS tile").
api_version = "2025-07"

[[extensions]]
type = "ui_extension"
name = "SNH Staff"
handle = "snh-staff-tile"

[[extensions.targeting]]
module = "./src/Tile.jsx"
target = "pos.home.tile.render"

[[extensions.targeting]]
module = "./src/Modal.jsx"
target = "pos.home.modal.render"
